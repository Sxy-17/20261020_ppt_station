<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>PPT 翻新工作台</title>
<!-- 绝对路径：页面挂在 /t/<任务>/p/ 下（见 server.py workbench 的注释），相对路径会错位 -->
<link rel="stylesheet" href="/static/workbench.css">
</head>
<body>

<header id="top">
  <span id="deck">—</span>
  <span id="pageno" title="点击输入页码跳转"></span>
  <div id="strip"></div>
  <span id="tally"></span>
  <button id="more" title="更多">···</button>
</header>
<!-- 低频动作只放这里（PLAN §8.3）：主界面不常驻 -->
<div id="menu" hidden>
  <button data-act="gen">一键出稿（剩余页）<span class="k" id="gen-state"></span></button>
  <button data-act="export">导出状态</button>
  <button data-act="keys">快捷键</button>
</div>

<main id="main">
  <!-- 每栏 = 固定外框（标签/状态签/按钮不随内容滚动）+ 可滚动内层（Ctrl+滚轮放大后可平移） -->
  <section class="pane" id="orig-pane">
    <span class="label" id="orig-label">原页</span>
    <div class="scroller" id="orig-scroll">
      <div class="slide" id="orig-slide"><img id="orig-img" alt="原页" draggable="false"></div>
    </div>
  </section>
  <div id="split" title="拖动调整左右宽度 · 双击恢复一半一半"></div>
  <section class="pane" id="draft-pane">
    <span class="label" id="draft-label">新稿</span>
    <!-- 状态签：未保存 / 已保存 / 质检未过 / 裁决含义——每页只有这一个位置说话 -->
    <span id="chip"></span>
    <div class="scroller" id="draft-scroll">
      <div class="slide" id="draft-slide">
        <div id="svgbox"></div>
        <!-- 编辑覆盖层放在 svgbox 外面：换页只换 svgbox，覆盖层不会被清掉（旧版的坑，诊断 #2） -->
        <div id="selbox" hidden></div>
        <!-- 浮动属性条：贴着选中元素出现，只放这个元素用得上的控件 -->
        <div id="props" hidden></div>
        <div id="wait" hidden></div>
      </div>
    </div>
    <!-- 新建：文本 / 矩形 / 图片（R7） -->
    <button id="add" title="新建元素" hidden>+</button>
    <div id="addmenu" hidden>
      <button data-new="text">文本</button>
      <button data-new="rect">矩形</button>
      <button data-new="image">图片…</button>
    </div>
    <input type="file" id="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
  </section>
</main>

<footer id="bottom">
  <div class="verdicts">
    <button class="vb" data-v="keep" title="导出时用原页截图（再按一次撤销）" disabled><kbd>1</kbd>保留原图</button>
    <button class="vb" data-v="pass" title="导出时用当前新稿（再按一次撤销）" disabled><kbd>2</kbd>通过</button>
    <button class="vb" data-v="redraw" title="交给 agent 重画（再按一次撤销）" disabled><kbd>3</kbd>重绘</button>
  </div>
  <span id="msg"></span>
  <label id="opinion">
    <input id="op-input" maxlength="500">
    <span id="op-state"></span>
  </label>
</footer>

<div id="banner" hidden></div>

<script src="/static/workbench.js"></script>
<script src="/static/editor.js"></script>
<script src="/static/stream.js"></script>
</body>
</html>
