<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>PPT 工作台 · 审核</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body data-mode="single">
<header id="topbar">
  <span id="task-name" class="task-name">—</span>
  <span id="progress" class="progress">0/0</span>
  <div class="nav">
    <button id="btn-prev" title="上一页（←）">◀</button>
    <select id="page-select" title="跳页"></select>
    <button id="btn-next" title="下一页（→）">▶</button>
  </div>
  <div class="mode-toggle">
    <button id="mode-single" class="active">单页</button
    ><button id="mode-overview">总览</button>
  </div>
  <span class="kbd-hint">1 保留 · 2 通过 · 3 重绘 · S 星标 · ←/→ 翻页</span>
</header>

<main id="panes">

  <section class="pane">
    <div class="pane-title">原页</div>
    <div class="pane-body" id="original-body"><img id="original-img" alt="原页截图"></div>
  </section>
  <section class="pane">
    <div class="pane-title">新页 <span id="draft-state" class="draft-state"></span></div>
    <div class="pane-body" id="draft-body"><div id="draft-holder"></div></div>
  </section>
</main>

<div id="filter-chips" class="filter-chips"></div>
<main id="overview"></main>
<div id="bulkbar" style="display:none">
  <span id="bulk-count"></span>
  <button class="vbtn" data-bv="pass">✓ 通过</button>
  <button class="vbtn" data-bv="keep">▣ 保留</button>
  <button class="vbtn" data-bv="redraw">✦ 重绘</button>
  <button class="vbtn" data-bv="">清除裁决</button>
  <label class="skip"><input type="checkbox" id="bulk-skip" checked> 跳过已裁决</label>
  <span class="range">范围 <input id="bulk-from" type="number" min="1" style="width:64px"> –
    <input id="bulk-to" type="number" min="1" style="width:64px">
    <select id="bulk-range-v"><option value="pass">通过</option><option value="keep">保留</option><option value="redraw">重绘</option><option value="">清除</option></select>
    <button class="vbtn" id="bulk-range-apply">应用</button></span>
  <button class="vbtn" id="bulk-undo" title="Ctrl+Z">↩ 撤销上次批量</button>
  <button class="vbtn" id="bulk-cancel">取消选区</button>
</div>
<div id="filmstrip"></div>
<footer id="verdictbar">
  <div class="verdict-group">
    <button class="vbtn v-keep"   data-v="keep">1 保留原样</button>
    <button class="vbtn v-pass"   data-v="pass">2 通过当前稿</button>
    <button class="vbtn v-redraw" data-v="redraw">3 审美引擎重绘</button>
    <button class="vbtn v-clear"  data-v="">清除</button>
    <button class="vbtn v-star"   id="btn-star">★ 回看</button>
  </div>
  <div class="opinion">
    <input id="opinion-input" placeholder="意见框：大白话描述这页要怎么改，回车提交（如：这里做个逐渐展开的时间轴）">
    <button class="vbtn" id="opinion-send">提交</button>
  </div>
  <div class="meta" id="page-meta"></div>
</footer>

<script src="/static/app.js"></script>
<script src="/static/overview.js"></script>
<script src="/static/palette.js"></script>
<script src="/static/chrome.js"></script>
<script src="/static/notify.js"></script>
</body>
</html>
